<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>University Research Opportunity Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav">
  <div class="logo"><svg viewBox="0 0 32 32" width="30" height="30"><circle cx="16" cy="16" r="3.5" fill="#f5a623"/><g fill="none" stroke="#2dd4bf" stroke-width="1.8"><ellipse cx="16" cy="16" rx="13" ry="5"/><ellipse cx="16" cy="16" rx="13" ry="5" transform="rotate(60 16 16)"/><ellipse cx="16" cy="16" rx="13" ry="5" transform="rotate(120 16 16)"/></g></svg>
    <span>Research<b>Portal</b></span></div>
  <button class="btn amber" id="newBtn">+ Post Opportunity</button>
</nav>

<header class="hero">
  <div class="hero-text">
    <span class="eyebrow">University Research Office</span>
    <h1>Discover. Investigate. <em>Innovate.</em></h1>
    <div class="stats">
      <div><strong id="stTotal">0</strong><span>Opportunities</span></div>
      <div><strong id="stOpen">0</strong><span>Open now</span></div>
      <div><strong id="stPos">0</strong><span>Open positions</span></div>
    </div>
  </div>
  <svg class="hero-art" viewBox="0 0 420 360" role="img" aria-label="IT illustration: laptop with code, cloud and database">
  <!-- background glow -->
  <circle cx="210" cy="180" r="165" fill="#ffffff" fill-opacity=".05"/>
  <circle cx="210" cy="180" r="125" fill="none" stroke="#fff" stroke-opacity=".12" stroke-dasharray="4 8"/>

  <!-- cloud -->
  <g fill="#ffffff" fill-opacity=".14" stroke="#2dd4bf" stroke-width="2">
    <circle cx="175" cy="62" r="24"/><circle cx="212" cy="46" r="30"/><circle cx="250" cy="64" r="22"/>
    <rect x="175" y="62" width="75" height="24" stroke="none"/>
  </g>
  <rect x="160" y="62" width="105" height="26" fill="#13315c" stroke="none"/>
  <text x="212" y="72" text-anchor="middle" font-family="monospace" font-size="16" fill="#2dd4bf">CLOUD</text>

  <!-- connection lines -->
  <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 6" fill="none">
    <line x1="212" y1="92" x2="212" y2="120"/>
    <path d="M330 200 H375 V250"/>
    <path d="M90 200 H45 V250"/>
  </g>

  <!-- laptop screen -->
  <rect x="90" y="120" width="240" height="150" rx="10" fill="#0b1d3a" stroke="#2dd4bf" stroke-width="3"/>
  <circle cx="106" cy="134" r="4" fill="#ef4444"/><circle cx="120" cy="134" r="4" fill="#f5a623"/><circle cx="134" cy="134" r="4" fill="#22c55e"/>
  <!-- code lines -->
  <g stroke-width="6" stroke-linecap="round">
    <line x1="108" y1="160" x2="170" y2="160" stroke="#38bdf8"/><line x1="180" y1="160" x2="240" y2="160" stroke="#f5a623"/>
    <line x1="126" y1="180" x2="220" y2="180" stroke="#2dd4bf"/>
    <line x1="126" y1="200" x2="190" y2="200" stroke="#ffffff" stroke-opacity=".7"/><line x1="200" y1="200" x2="260" y2="200" stroke="#38bdf8"/>
    <line x1="108" y1="220" x2="150" y2="220" stroke="#f5a623"/><line x1="160" y1="220" x2="235" y2="220" stroke="#2dd4bf"/>
    <line x1="108" y1="240" x2="180" y2="240" stroke="#ffffff" stroke-opacity=".5"/>
  </g>
  <text x="300" y="250" text-anchor="end" font-family="monospace" font-size="26" font-weight="bold" fill="#f5a623">&lt;/&gt;</text>
  <!-- laptop base -->
  <path d="M60 270 H360 L345 290 H75 Z" fill="#a9c3d8"/>
  <rect x="180" y="270" width="60" height="6" rx="3" fill="#7f9bb3"/>

  <!-- database (right) -->
  <g transform="translate(345 250)">
    <rect x="0" y="10" width="60" height="55" fill="#13315c" stroke="#2dd4bf" stroke-width="2"/>
    <ellipse cx="30" cy="10" rx="30" ry="10" fill="#1d4e89" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M0 30 Q30 42 60 30 M0 48 Q30 60 60 48" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <ellipse cx="30" cy="65" rx="30" ry="10" fill="#13315c" stroke="#2dd4bf" stroke-width="2"/>
  </g>

  <!-- server (left) -->
  <g transform="translate(15 250)">
    <rect x="0" y="0" width="60" height="22" rx="4" fill="#13315c" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="27" width="60" height="22" rx="4" fill="#13315c" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="54" width="60" height="22" rx="4" fill="#13315c" stroke="#38bdf8" stroke-width="2"/>
    <g fill="#22c55e"><circle cx="12" cy="11" r="3"/><circle cx="12" cy="38" r="3"/><circle cx="12" cy="65" r="3"/></g>
    <g stroke="#f5a623" stroke-width="3"><line x1="26" y1="11" x2="48" y2="11"/><line x1="26" y1="38" x2="48" y2="38"/><line x1="26" y1="65" x2="48" y2="65"/></g>
  </g>

  <!-- circuit nodes -->
  <g fill="#2dd4bf"><circle cx="40" cy="120" r="5"/><circle cx="385" cy="130" r="5"/><circle cx="60" cy="60" r="4"/><circle cx="370" cy="70" r="4"/></g>
  <g stroke="#2dd4bf" stroke-opacity=".5" stroke-width="2" fill="none">
    <path d="M40 120 H70 V95"/><path d="M385 130 H355 V105"/><path d="M60 60 H110"/><path d="M370 70 H320"/>
  </g>
</svg>
</header>

<main class="wrap">
  <div id="msg" class="toast" role="status" aria-live="polite" hidden></div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="🔍  Search by title, area, faculty, department or skill" aria-label="Search">
    <select id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option><option>Open</option><option>Closed</option></select>
    <span id="count" class="count"></span>
  </div>
  <div id="list" class="grid"></div>
</main>

<footer class="foot">University Research Opportunity Portal · Built for faculty and students</footer>

<dialog id="detailDlg"><article id="detailBody"></article></dialog>

<dialog id="formDlg">
  <form id="oppForm" novalidate>
    <h2 id="formTitle">New Opportunity</h2>
    <input type="hidden" id="oppId">
    <label>Research title *<input id="title" maxlength="200" placeholder="e.g. Deep Learning for Medical Imaging"><span class="err" data-for="title"></span></label>
    <label>Research description *<textarea id="description" rows="4" placeholder="Describe the project, goals and what the student will do"></textarea><span class="err" data-for="description"></span></label>
    <div class="row">
      <label>Research area *<input id="research_area" maxlength="100" placeholder="e.g. Machine Learning"><span class="err" data-for="research_area"></span></label>
      <label>Department *<input id="department" maxlength="100" placeholder="e.g. Computer Science"><span class="err" data-for="department"></span></label>
    </div>
    <label>Faculty member's name *<input id="faculty_name" maxlength="100" placeholder="e.g. Dr. Jane Smith"><span class="err" data-for="faculty_name"></span></label>
    <label>Required skills * <small>(comma separated)</small><input id="required_skills" maxlength="500" placeholder="e.g. Python, Statistics, PyTorch"><span class="err" data-for="required_skills"></span></label>
    <div class="row three">
      <label>Positions *<input id="positions" type="number" min="1" max="1000"><span class="err" data-for="positions"></span></label>
      <label>Application deadline *<input id="deadline" type="date"><span class="err" data-for="deadline"></span></label>
      <label>Status<select id="status"><option>Open</option><option>Closed</option></select></label>
    </div>
    <div class="actions"><button type="button" class="btn ghost" id="cancelBtn">Cancel</button><button type="submit" class="btn primary">Save Opportunity</button></div>
  </form>
</dialog>
<script src="script.js"></script>
</body>
</html>
